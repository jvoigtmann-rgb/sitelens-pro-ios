workflows:
  ios-testflight:
    name: SiteLens Pro iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - sitelens_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.base6a92d4567d7a3a8b4ec54b7b.app
      vars:
        VITE_REVENUECAT_APPLE_PUBLIC_KEY: appl_DzhGZLGkODLbsRuTafFeoSoSeLc      
            node: 22
      xcode: latest
      cocoapods: default
   scripts:
      - name: Fetch Apple signing files
        script: |
          app-store-connect fetch-signing-files \
            "com.base6a92d4567d7a3a8b4ec54b7b.app" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Generate iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Set build number and signing
        script: |
          cd ios/App
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 3' App/Info.plist || true
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
