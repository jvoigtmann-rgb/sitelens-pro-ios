workflows:
  ios-testflight:
    name: SiteLens Pro iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - sitelens_ios
      ios_signing:
        distribution_type: app_store
        VITE_REVENUECAT_APPLE_PUBLIC_KEY: "appl_DzhGZLGkODLbsRuTafFeoSoSeLc"
        # Set VITE_BASE44_APP_ID and other required Base44 config in Codemagic environment variables.
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Generate iOS project
        script: |
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Set build number and signing
        script: |
          cd ios/App
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 3' App/Info.plist || true
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
